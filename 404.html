<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada — Los Angelitos</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:linear-gradient(135deg,#003F7A 0%,#0055A4 60%,#FF6B00 100%);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;color:white;text-align:center;padding:2rem}
.card{background:rgba(255,255,255,.10);backdrop-filter:blur(16px);border:1.5px solid rgba(255,255,255,.18);border-radius:28px;padding:3rem 2.5rem;max-width:480px;width:100%;box-shadow:0 24px 64px rgba(0,0,0,.3)}
.emoji{font-size:4rem;margin-bottom:1rem;display:block;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
h1{font-family:'Poppins',sans-serif;font-size:5rem;font-weight:800;line-height:1;color:white;margin-bottom:.3rem;text-shadow:0 4px 16px rgba(0,0,0,.25)}
h2{font-family:'Poppins',sans-serif;font-size:1.4rem;font-weight:700;margin-bottom:.8rem;color:rgba(255,255,255,.95)}
p{color:rgba(255,255,255,.75);font-size:.95rem;line-height:1.6;margin-bottom:2rem}
.btn{display:inline-flex;align-items:center;gap:.6rem;background:#FF6B00;color:white;padding:.9rem 2rem;border-radius:50px;text-decoration:none;font-family:'DM Sans',sans-serif;font-weight:800;font-size:1rem;transition:transform .2s,box-shadow .2s;box-shadow:0 6px 20px rgba(255,107,0,.45)}
.btn:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(255,107,0,.55)}
.logo{font-family:'Poppins',sans-serif;font-size:1.1rem;font-weight:800;color:rgba(255,255,255,.55);margin-top:2rem}
.logo span{color:#FF6B00}
</style>
</head>
<body>
  <div class="card">
    <span class="emoji">😇</span>
    <h1>404</h1>
    <h2>Esta página no existe</h2>
    <p>El link que seguiste puede estar roto o el producto ya no estar disponible. Pero en la tienda seguro encontrás lo que buscás.</p>
    <a href="/" class="btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Volver a la tienda
    </a>
  </div>
  <div class="logo">Los <span>Angelitos</span> — Librería &amp; Juguetes</div>
</body>
</html>
